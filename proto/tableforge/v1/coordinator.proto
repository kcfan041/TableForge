syntax = "proto3";

package tableforge.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "tableforge/v1/capabilities.proto";
import "tableforge/v1/common.proto";
import "tableforge/v1/jobs.proto";

service CoordinatorService {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc RotateSession(RotateSessionRequest) returns (EnrollResponse);
  // Unauthenticated: identifies the cluster before a node trusts it.
  rpc GetClusterInfo(GetClusterInfoRequest) returns (ClusterInfo);
  // Exchanges a single-use invite secret for a node session and/or operator credential.
  rpc RedeemInvite(RedeemInviteRequest) returns (RedeemInviteResponse);
  // Node session only: registers one worker process (slot) of this node.
  rpc StartWorker(StartWorkerRequest) returns (StartWorkerResponse);
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc ClaimJob(ClaimJobRequest) returns (ClaimJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc RenewLease(RenewLeaseRequest) returns (RenewLeaseResponse);
  rpc CompleteJob(CompleteJobRequest) returns (CompleteJobResponse);
  rpc FailJob(FailJobRequest) returns (FailJobResponse);
  rpc AcknowledgeCancel(AcknowledgeCancelRequest) returns (AcknowledgeCancelResponse);
}

service ArtifactService {
  rpc UploadArtifact(stream UploadArtifactChunk) returns (UploadArtifactResponse);
  rpc DownloadArtifact(DownloadArtifactRequest) returns (stream DownloadArtifactChunk);
  rpc RequestUpload(RequestUploadRequest) returns (RequestUploadResponse);
  rpc CommitUpload(CommitUploadRequest) returns (UploadArtifactResponse);
  rpc RequestDownload(DownloadArtifactRequest) returns (RequestDownloadResponse);
}

message EnrollRequest {
  string node_id = 1;
  string enrollment_token = 2;
}

message EnrollResponse {
  string session_token = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message RotateSessionRequest {}

message RegisterNodeRequest {
  NodeCapability capability = 1;
}

message RegisterNodeResponse {}

message HeartbeatRequest {
  string node_id = 1;
  uint64 capability_revision = 2;
}

message HeartbeatResponse {}

message ClaimJobRequest {
  string node_id = 1;
  NodeCapability capability = 2;
  google.protobuf.Duration lease_duration = 3;
  // Worker slot obtained from StartWorker; empty for legacy single-slot workers.
  string worker_id = 4;
}

message GetClusterInfoRequest {}

message ClusterInfo {
  string cluster_id = 1;
  string coordinator_version = 2;
  // Wire protocol spoken by the coordinator, and the oldest client protocol it accepts.
  uint32 protocol_version = 3;
  uint32 min_protocol_version = 4;
}

message RedeemInviteRequest {
  string invite_secret = 1;
  // Required when the invite enrolls a node.
  string node_id = 2;
}

message StorageEndpoint {
  // Empty name is the coordinator's default endpoint.
  string name = 1;
  string url = 2;
  uint32 priority = 3;
}

message NodeSettings {
  repeated StorageEndpoint storage_endpoints = 1;
  google.protobuf.Duration lease_duration = 2;
  google.protobuf.Duration idle_interval = 3;
  bool direct_transfer = 4;
}

message RedeemInviteResponse {
  string cluster_id = 1;
  string scope = 2;
  string session_token = 3;
  google.protobuf.Timestamp session_expires_at = 4;
  string operator_id = 5;
  string operator_token = 6;
  string operator_role = 7;
  google.protobuf.Timestamp operator_expires_at = 8;
  NodeSettings node_settings = 9;
}

message StartWorkerRequest {
  string node_id = 1;
  string label = 2;
}

message StartWorkerResponse {
  string worker_id = 1;
  string cluster_id = 2;
  NodeSettings node_settings = 3;
}

message ClaimJobResponse {
  optional JobLease lease = 1;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message RenewLeaseRequest {
  string job_id = 1;
  string lease_token = 2;
  google.protobuf.Duration lease_duration = 3;
}

message RenewLeaseResponse {
  JobLease lease = 1;
}

message CompleteJobRequest {
  string job_id = 1;
  string lease_token = 2;
  string result_hash = 3;
  repeated Artifact outputs = 4;
}

message CompleteJobResponse {
  Job job = 1;
}

message FailJobRequest {
  string job_id = 1;
  string lease_token = 2;
  string error_code = 3;
  string error_summary = 4;
  bool retryable = 5;
  string diagnostic_artifact_id = 6;
}

message FailJobResponse {
  Job job = 1;
}

message AcknowledgeCancelRequest {
  string job_id = 1;
  string lease_token = 2;
}

message AcknowledgeCancelResponse {
  Job job = 1;
}

message UploadArtifactChunk {
  ArtifactRef descriptor = 1;
  bytes data = 2;
}

message UploadArtifactResponse {
  Artifact artifact = 1;
}

message DownloadArtifactRequest {
  string artifact_id = 1;
  // Name of a storage endpoint configured on the coordinator; empty for the default.
  string endpoint = 2;
}

message DownloadArtifactChunk {
  Artifact artifact = 1;
  bytes data = 2;
}

message HttpHeader {
  string name = 1;
  string value = 2;
}

message SignedTransfer {
  string method = 1;
  string url = 2;
  repeated HttpHeader headers = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message RequestUploadRequest {
  string sha256 = 1;
  uint64 size_bytes = 2;
  // Name of a storage endpoint configured on the coordinator; empty for the default.
  string endpoint = 3;
}

message RequestUploadResponse {
  bool direct = 1;
  bool already_stored = 2;
  SignedTransfer transfer = 3;
}

message CommitUploadRequest {
  ArtifactRef descriptor = 1;
}

message RequestDownloadResponse {
  bool direct = 1;
  Artifact artifact = 2;
  SignedTransfer transfer = 3;
}
