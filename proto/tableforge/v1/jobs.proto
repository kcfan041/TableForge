syntax = "proto3";

package tableforge.v1;

import "google/protobuf/timestamp.proto";
import "tableforge/v1/common.proto";

message JobSpec {
  string schema_version = 1;
  string job_id = 2;
  string experiment_id = 3;
  JobType type = 4;
  int32 priority = 5;
  ResourceRequest resources = 6;
  repeated ArtifactRef inputs = 7;
  bytes payload = 8;
  string payload_type = 9;
  string idempotency_key = 10;
  int32 max_attempts = 11;
  google.protobuf.Timestamp not_before = 12;
  google.protobuf.Timestamp created_at = 13;
  repeated Artifact input_artifacts = 14;
}

enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  JOB_TYPE_SIMULATION = 1;
  JOB_TYPE_EVALUATION = 2;
  JOB_TYPE_TRAINING = 3;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_QUEUED = 1;
  JOB_STATUS_LEASED = 2;
  JOB_STATUS_RUNNING = 3;
  JOB_STATUS_RETRY_WAIT = 4;
  JOB_STATUS_SUCCEEDED = 5;
  JOB_STATUS_FAILED = 6;
  JOB_STATUS_CANCELLED = 7;
  JOB_STATUS_CANCEL_REQUESTED = 8;
}

message Job {
  JobSpec spec = 1;
  JobStatus status = 2;
  uint64 version = 3;
}

message JobLease {
  Job job = 1;
  string attempt_id = 2;
  string node_id = 3;
  string token = 4;
  uint32 attempt_number = 5;
  google.protobuf.Timestamp leased_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  string execution_plan_json = 8;
}
