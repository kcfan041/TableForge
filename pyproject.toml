[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tableforge"
version = "0.1.0"
description = "Distributed multi-agent poker AI training and evaluation framework"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.13.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tableforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tableforge"]
