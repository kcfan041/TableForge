[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tableforge"
version = "0.1.0"
description = "Distributed multi-agent poker AI training and evaluation framework"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "grpcio>=1.84.0",
    "protobuf>=7.36.2",
]

[project.scripts]
tableforge = "tableforge.cli.main:main"

[project.optional-dependencies]
learning = [
    "numpy>=2.5.3",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
]

gpu = [
    "nvidia-ml-py>=12.0",
]
postgres = [
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
]
s3 = [
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "hypothesis>=6.140.3",
    "mypy>=1.18.2",
    "mypy-protobuf>=5.1.0",
    "pytest>=8.4.2",
    "ruff>=0.13.1",
    "types-grpcio>=1.83.0.20260730",
    "types-protobuf>=7.35.1.20260906",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/tableforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "multiprocess: starts real coordinator and worker processes",
    "slow: long-running learning or soak tests",
    "postgres: runs against a real PostgreSQL server",
    "s3: runs against a real S3-compatible object store",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/tableforge/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tableforge"]

[[tool.mypy.overrides]]
module = "tableforge._generated.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
